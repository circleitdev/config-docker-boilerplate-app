services:
    cit-headroom:
        image: ghcr.io/chopratejas/headroom:latest
        container_name: cit-headroom
        security_opt:
            - no-new-privileges:true
        networks:
            - cit-headroom-network
        env_file: .env
        restart: unless-stopped
        init: true
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8787/readyz']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s

networks:
    cit-headroom-network:
        name: cit-headroom-network
