services:
    cit-chatwoot:
        image: chatwoot/chatwoot:v4.15.1
        container_name: cit-chatwoot
        security_opt:
            - no-new-privileges:true
        volumes:
            - cit-chatwoot-storage-data:/app/storage
        networks:
            - traefik-network
            - cit-chatwoot-postgres-network
            - cit-chatwoot-redis-network
        env_file: .env
        restart: unless-stopped
        command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
        labels:
            - 'traefik.enable=true'

            - 'traefik.http.routers.${TRAEFIK_ROUTER}.entryPoints=websecure'
            - 'traefik.http.routers.${TRAEFIK_ROUTER}.rule=${TRAEFIK_HOST}'
            - 'traefik.http.routers.${TRAEFIK_ROUTER}.tls=true'
            - 'traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=leResolver'
            - 'traefik.http.routers.${TRAEFIK_ROUTER}.service=${TRAEFIK_SERVICE}@docker'
            - 'traefik.http.services.${TRAEFIK_SERVICE}.loadbalancer.server.port=20128'

            - 'traefik.docker.network=traefik-network'
        init: true
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s

    cit-chatwoot-sidekiq:
        image: chatwoot/chatwoot:v4.15.1
        container_name: cit-chatwoot-sidekiq
        security_opt:
            - no-new-privileges:true
        networks:
            - cit-chatwoot-postgres-network
            - cit-chatwoot-redis-network
        env_file: .env
        restart: unless-stopped
        command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
        init: true
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s

volumes:
    cit-chatwoot-storage-data:
        name: cit-chatwoot-storage-data

networks:
    traefik-network:
        name: traefik-network
        external: true
    cit-chatwoot-postgres-network:
        name: cit-chatwoot-postgres-network
        external: true
    cit-chatwoot-redis-network:
        name: cit-chatwoot-redis-network
        external: true
    cit-chatwoot-network:
        name: cit-chatwoot-network
