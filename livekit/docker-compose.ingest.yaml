# OPTIONAL PUBLIC INGEST (RTMP/WHIP)
services:
    cit-livekit-ingress:
        ports:
            - '${LIVEKIT_INGRESS_RTMP_PORT:-1935}:1935'
            - '${LIVEKIT_INGRESS_UDP_PORT:-7885}:${LIVEKIT_INGRESS_UDP_PORT:-7885}/udp'
        labels:
            - 'traefik.enable=true'

            - 'traefik.http.routers.${TRAEFIK_WHIP_ROUTER}.entryPoints=websecure'
            - 'traefik.http.routers.${TRAEFIK_WHIP_ROUTER}.rule=${TRAEFIK_WHIP_HOST}'
            - 'traefik.http.routers.${TRAEFIK_WHIP_ROUTER}.tls=true'
            - 'traefik.http.routers.${TRAEFIK_WHIP_ROUTER}.tls.certresolver=leResolver'
            - 'traefik.http.routers.${TRAEFIK_WHIP_ROUTER}.service=${TRAEFIK_WHIP_SERVICE}@docker'
            - 'traefik.http.services.${TRAEFIK_WHIP_SERVICE}.loadbalancer.server.port=8080'

            - 'traefik.docker.network=traefik-network'
